<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 175" width="100%" height="100%">
  <defs>
    <linearGradient id="trophyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36BCF7" />
      <stop offset="100%" stop-color="#7AA2F7" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BB9AF7" />
      <stop offset="100%" stop-color="#7AA2F7" />
    </linearGradient>
  </defs>

  <!-- Trophy 1: Commits -->
  <rect x="8" y="8" width="170" height="158" rx="12" fill="url(#trophyBg)" stroke="#36BCF7" stroke-width="1.4" stroke-opacity="0.65" />
  <text x="93" y="30" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#36BCF7">COMMITS</text>
  <circle cx="93" cy="74" r="26" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <text x="93" y="83" text-anchor="middle" font-size="24">🏆</text>
  <text x="93" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#f8fafc">RANK: S+</text>
  <text x="93" y="142" text-anchor="middle" font-family="monospace" font-size="11" fill="#9ECE6A">1,018+ Total</text>

  <!-- Trophy 2: Repositories -->
  <rect x="191" y="8" width="170" height="158" rx="12" fill="url(#trophyBg)" stroke="#7AA2F7" stroke-width="1.4" stroke-opacity="0.65" />
  <text x="276" y="30" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#7AA2F7">REPOSITORIES</text>
  <circle cx="276" cy="74" r="26" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <text x="276" y="83" text-anchor="middle" font-size="24">📦</text>
  <text x="276" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#f8fafc">RANK: AAA</text>
  <text x="276" y="142" text-anchor="middle" font-family="monospace" font-size="11" fill="#36BCF7">36 Public Repos</text>

  <!-- Trophy 3: Cloud Architect -->
  <rect x="374" y="8" width="170" height="158" rx="12" fill="url(#trophyBg)" stroke="#BB9AF7" stroke-width="1.4" stroke-opacity="0.65" />
  <text x="459" y="30" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#BB9AF7">AWS ARCHITECT</text>
  <circle cx="459" cy="74" r="26" fill="#0f172a" stroke="url(#purpleGrad)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <text x="459" y="83" text-anchor="middle" font-size="24">☁️</text>
  <text x="459" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#f8fafc">RANK: S+</text>
  <text x="459" y="142" text-anchor="middle" font-family="monospace" font-size="11" fill="#BB9AF7">SAA Certified</text>

  <!-- Trophy 4: Full-Stack Master -->
  <rect x="557" y="8" width="170" height="158" rx="12" fill="url(#trophyBg)" stroke="#36BCF7" stroke-width="1.4" stroke-opacity="0.65" />
  <text x="642" y="30" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#36BCF7">FULL-STACK</text>
  <circle cx="642" cy="74" r="26" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite" />
  </circle>
  <text x="642" y="83" text-anchor="middle" font-size="24">⚡</text>
  <text x="642" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#f8fafc">RANK: AAA</text>
  <text x="642" y="142" text-anchor="middle" font-family="monospace" font-size="11" fill="#9ECE6A">Django + React</text>

  <!-- Trophy 5: Experience -->
  <rect x="740" y="8" width="170" height="158" rx="12" fill="url(#trophyBg)" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.65" />
  <text x="825" y="30" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24">EXPERIENCE</text>
  <circle cx="825" cy="74" r="26" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <text x="825" y="83" text-anchor="middle" font-size="24">🎖️</text>
  <text x="825" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#f8fafc">RANK: AA</text>
  <text x="825" y="142" text-anchor="middle" font-family="monospace" font-size="11" fill="#fbbf24">Since Nov 2020</text>

  <!-- Trophy 6: DevOps Automation -->
  <rect x="922" y="8" width="170" height="158" rx="12" fill="url(#trophyBg)" stroke="#BB9AF7" stroke-width="1.4" stroke-opacity="0.65" />
  <text x="1007" y="30" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#BB9AF7">AUTOMATION</text>
  <circle cx="1007" cy="74" r="26" fill="#0f172a" stroke="url(#purpleGrad)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.9s" repeatCount="indefinite" />
  </circle>
  <text x="1007" y="83" text-anchor="middle" font-size="24">🐳</text>
  <text x="1007" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#f8fafc">RANK: AAA</text>
  <text x="1007" y="142" text-anchor="middle" font-family="monospace" font-size="11" fill="#36BCF7">Docker &amp; Ansible</text>
</svg>
