<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
  </defs>

  <!-- Terminal Window Frame -->
  <rect width="880" height="390" rx="14" fill="url(#termBg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Top Window Bar -->
  <path d="M 0 14 Q 0 0 14 0 L 866 0 Q 880 0 880 14 L 880 42 L 0 42 Z" fill="url(#headerBg)" />
  <line x1="0" y1="42" x2="880" y2="42" stroke="#30363d" stroke-width="1" />

  <!-- macOS Traffic Light Controls -->
  <circle cx="24" cy="21" r="6.5" fill="#ff5f56" />
  <circle cx="46" cy="21" r="6.5" fill="#ffbd2e" />
  <circle cx="68" cy="21" r="6.5" fill="#27c93f" />

  <text x="440" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
    faizan@cloud-node: ~/profile/telemetry.sh — zsh
  </text>

  <!-- Block 1: Command & Identity (Absolute Y coordinates, zero CSS transform conflict) -->
  <g font-family="'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14">
    <text x="28" y="74">
      <tspan fill="#36BCF7" font-weight="700">faizan@aws-cloud</tspan><tspan fill="#64748b">:</tspan><tspan fill="#BB9AF7" font-weight="700">~</tspan><tspan fill="#f8fafc" font-weight="600">$ cat developer_profile.yml</tspan>
    </text>

    <text x="28" y="102">
      <tspan fill="#7AA2F7" font-weight="600">developer</tspan><tspan fill="#94a3b8">:</tspan> <tspan fill="#9ECE6A">"Mohammad Faizan Qureshi"</tspan>
    </text>
    <text x="28" y="126">
      <tspan fill="#7AA2F7" font-weight="600">role</tspan><tspan fill="#94a3b8">:</tspan>      <tspan fill="#9ECE6A">"Full-Stack Developer &amp; Cloud/DevOps Engineer"</tspan>
    </text>
    <text x="28" y="150">
      <tspan fill="#7AA2F7" font-weight="600">location</tspan><tspan fill="#94a3b8">:</tspan>  <tspan fill="#9ECE6A">"Nashik, Maharashtra, India"</tspan>
    </text>

    <!-- Block 2: Architecture Stack -->
    <text x="28" y="184">
      <tspan fill="#7AA2F7" font-weight="600">architecture_stack</tspan><tspan fill="#94a3b8">:</tspan>
    </text>
    <text x="46" y="208">
      <tspan fill="#36BCF7">▸</tspan> <tspan fill="#7AA2F7" font-weight="600">backend_apis</tspan><tspan fill="#94a3b8">:</tspan>   <tspan fill="#e2e8f0">[Python, Django, FastAPI, RESTful Architecture]</tspan>
    </text>
    <text x="46" y="232">
      <tspan fill="#36BCF7">▸</tspan> <tspan fill="#7AA2F7" font-weight="600">frontend_ui</tspan><tspan fill="#94a3b8">:</tspan>    <tspan fill="#e2e8f0">[React.js, JavaScript ES6+, Responsive HTML5/CSS3]</tspan>
    </text>
    <text x="46" y="256">
      <tspan fill="#36BCF7">▸</tspan> <tspan fill="#7AA2F7" font-weight="600">cloud_devops</tspan><tspan fill="#94a3b8">:</tspan>   <tspan fill="#e2e8f0">[AWS (SAA), Docker, Ansible, Linux, Nginx, Vagrant]</tspan>
    </text>

    <!-- Block 3: Cluster Telemetry Status Cards -->
    <text x="28" y="290">
      <tspan fill="#36BCF7" font-weight="700">faizan@aws-cloud</tspan><tspan fill="#64748b">:</tspan><tspan fill="#BB9AF7" font-weight="700">~</tspan><tspan fill="#f8fafc" font-weight="600">$ ./check_clusters.sh --status</tspan>
    </text>

    <!-- Card 1 -->
    <rect x="28" y="304" width="260" height="44" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.2" />
    <circle cx="46" cy="326" r="5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="60" y="322" font-size="11" fill="#8b949e">FULL-STACK APPS</text>
    <text x="60" y="338" font-size="12" font-weight="700" fill="#e6edf3">Django + React • READY</text>

    <!-- Card 2 -->
    <rect x="308" y="304" width="260" height="44" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.2" />
    <circle cx="326" cy="326" r="5" fill="#36BCF7">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="340" y="322" font-size="11" fill="#8b949e">CLOUD INFRASTRUCTURE</text>
    <text x="340" y="338" font-size="12" font-weight="700" fill="#e6edf3">AWS Certified • ACTIVE</text>

    <!-- Card 3 -->
    <rect x="588" y="304" width="264" height="44" rx="8" fill="#161b22" stroke="#8957e5" stroke-width="1.2" />
    <circle cx="606" cy="326" r="5" fill="#BB9AF7">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="620" y="322" font-size="11" fill="#8b949e">AUTOMATION PIPELINE</text>
    <text x="620" y="338" font-size="12" font-weight="700" fill="#e6edf3">Docker + Ansible • SYNCED</text>

    <!-- Block 4: Active Prompt with Blinking Cursor -->
    <text x="28" y="372">
      <tspan fill="#36BCF7" font-weight="700">faizan@aws-cloud</tspan><tspan fill="#64748b">:</tspan><tspan fill="#BB9AF7" font-weight="700">~</tspan><tspan fill="#f8fafc" font-weight="600">$ deploy --production --zero-downtime</tspan>
    </text>
    <rect x="492" y="358" width="9" height="17" fill="#36BCF7">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
