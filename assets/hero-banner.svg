<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36BCF7">
        <animate attributeName="stop-color" values="#36BCF7;#BB9AF7;#7AA2F7;#36BCF7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7AA2F7">
        <animate attributeName="stop-color" values="#7AA2F7;#36BCF7;#BB9AF7;#7AA2F7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#BB9AF7">
        <animate attributeName="stop-color" values="#BB9AF7;#7AA2F7;#36BCF7;#BB9AF7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36BCF7" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#7AA2F7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#BB9AF7" stop-opacity="0.18" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BB9AF7" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#36BCF7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2AC3DE" stop-opacity="0.12" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#36BCF7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#36BCF7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BB9AF7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#BB9AF7" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.55" />
    </pattern>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="18" fill="url(#grid)" />

  <!-- Ambient Animated Glow Orbs -->
  <circle cx="220" cy="110" r="220" fill="url(#glowCyan)">
    <animate attributeName="cx" values="200;290;200" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;150;100" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="980" cy="240" r="250" fill="url(#glowPurple)">
    <animate attributeName="cx" values="980;880;980" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="240;170;240" dur="12s" repeatCount="indefinite" />
  </circle>

  <!-- Subtle Tech Circuit Lines -->
  <path d="M 0 80 L 180 80 L 220 120 L 340 120" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M 0 80 L 180 80 L 220 120 L 340 120" fill="none" stroke="#36BCF7" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-200" dur="8s" repeatCount="indefinite" />
  </path>
  <circle cx="340" cy="120" r="4" fill="#36BCF7" opacity="0.7" />

  <path d="M 1200 100 L 1020 100 L 980 140 L 860 140" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M 1200 100 L 1020 100 L 980 140 L 860 140" fill="none" stroke="#BB9AF7" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-200" dur="8s" repeatCount="indefinite" />
  </path>
  <circle cx="860" cy="140" r="4" fill="#BB9AF7" opacity="0.7" />

  <!-- Floating Code/Cloud Decorative Nodes (SMIL animateTransform, high-contrast text) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="6s" repeatCount="indefinite" />
    <rect x="55" y="165" width="155" height="44" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#36BCF7" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="77" cy="187" r="5.5" fill="#36BCF7" />
    <text x="93" y="192" font-family="'Fira Code', Consolas, monospace" font-size="13" font-weight="700" fill="#e2e8f0">&lt;FullStack /&gt;</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,10; 0,0" dur="7s" repeatCount="indefinite" />
    <rect x="990" y="175" width="155" height="44" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#BB9AF7" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="1012" cy="197" r="5.5" fill="#BB9AF7" />
    <text x="1028" y="202" font-family="'Fira Code', Consolas, monospace" font-size="13" font-weight="700" fill="#e2e8f0">aws :: cloud</text>
  </g>

  <!-- Animated Bottom Waves -->
  <path fill="url(#waveGrad2)" d="M0,310 C300,370 600,250 900,310 C1050,340 1150,320 1200,300 L1200,380 L0,380 Z">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0,310 C300,370 600,250 900,310 C1050,340 1150,320 1200,300 L1200,380 L0,380 Z;
              M0,295 C300,240 600,360 900,290 C1050,260 1150,310 1200,320 L1200,380 L0,380 Z;
              M0,310 C300,370 600,250 900,310 C1050,340 1150,320 1200,300 L1200,380 L0,380 Z" />
  </path>

  <path fill="url(#waveGrad1)" d="M0,330 C250,280 550,370 850,320 C1020,290 1120,335 1200,325 L1200,380 L0,380 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0,330 C250,280 550,370 850,320 C1020,290 1120,335 1200,325 L1200,380 L0,380 Z;
              M0,315 C250,365 550,275 850,340 C1020,355 1120,300 1200,315 L1200,380 L0,380 Z;
              M0,330 C250,280 550,370 850,320 C1020,290 1120,335 1200,325 L1200,380 L0,380 Z" />
  </path>

  <!-- Top Status Pill -->
  <rect x="435" y="38" width="330" height="32" rx="16" fill="#0f172a" stroke="#36BCF7" stroke-width="1.2" stroke-opacity="0.5" />
  <circle cx="457" cy="54" r="4.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    <animate attributeName="r" values="4.5;6;4.5" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="473" y="58" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="12" fill="#36BCF7" letter-spacing="1.5">
    SYSTEM ONLINE // AVAILABLE FOR WORK
  </text>

  <!-- Main Heading -->
  <text x="600" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="46" fill="#f8fafc">
    Hi, I'm <tspan fill="url(#accentGrad)" filter="url(#neonGlow)">Mohammad Faizan Qureshi</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="182" text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="18" fill="#cbd5e1" letter-spacing="2">
    FULL-STACK ENGINEER  •  AWS CLOUD ARCHITECT  •  DEVOPS AUTOMATION
  </text>

  <!-- Role Pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">
    <rect x="245" y="218" width="165" height="36" rx="18" fill="#1e293b" stroke="#36BCF7" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="327.5" y="241" text-anchor="middle">🐍 Python &amp; Django</text>

    <rect x="425" y="218" width="165" height="36" rx="18" fill="#1e293b" stroke="#7AA2F7" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="507.5" y="241" text-anchor="middle">⚛️ React Frontend</text>

    <rect x="605" y="218" width="165" height="36" rx="18" fill="#1e293b" stroke="#BB9AF7" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="687.5" y="241" text-anchor="middle">☁️ AWS Cloud Infra</text>

    <rect x="785" y="218" width="170" height="36" rx="18" fill="#1e293b" stroke="#2AC3DE" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="870" y="241" text-anchor="middle">🐳 Docker &amp; Ansible</text>
  </g>

  <!-- Location Tag -->
  <text x="600" y="302" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
    📍 Nashik, Maharashtra, India   •   Building Scalable, Automated &amp; Resilient Cloud Systems
  </text>

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="1198" height="378" rx="17" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.45" />
</svg>
