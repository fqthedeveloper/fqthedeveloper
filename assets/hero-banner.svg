<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36BCF7">
        <animate attributeName="stop-color" values="#36BCF7;#BB9AF7;#7AA2F7;#36BCF7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7AA2F7">
        <animate attributeName="stop-color" values="#7AA2F7;#36BCF7;#BB9AF7;#7AA2F7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#BB9AF7">
        <animate attributeName="stop-color" values="#BB9AF7;#7AA2F7;#36BCF7;#BB9AF7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36BCF7" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#7AA2F7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#BB9AF7" stop-opacity="0.18" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BB9AF7" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#36BCF7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2AC3DE" stop-opacity="0.12" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#36BCF7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#36BCF7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BB9AF7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#BB9AF7" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.55" />
    </pattern>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #f8fafc;
      letter-spacing: 0.5px;
    }
    .title-accent {
      fill: url(#accentGrad);
    }
    .subtitle {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-weight: 600;
      font-size: 18px;
      fill: #94a3b8;
      letter-spacing: 2px;
    }
    .badge-text {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-weight: 600;
      font-size: 12px;
      fill: #36BCF7;
      letter-spacing: 1.5px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .code-deco {
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 13px;
      fill: #334155;
      user-select: none;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; r: 4.5px; }
      50% { opacity: 0.4; r: 6.5px; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -200; }
    }
    .float-1 { animation: floatSlow 6s ease-in-out infinite; }
    .float-2 { animation: floatReverse 7s ease-in-out infinite; }
    .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
    .circuit-line {
      stroke-dasharray: 8 12;
      animation: dashMove 8s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="18" fill="url(#grid)" />

  <!-- Ambient Animated Glow Orbs -->
  <circle cx="220" cy="110" r="220" fill="url(#glowCyan)">
    <animate attributeName="cx" values="200;290;200" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;150;100" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="980" cy="240" r="250" fill="url(#glowPurple)">
    <animate attributeName="cx" values="980;880;980" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="240;170;240" dur="12s" repeatCount="indefinite" />
  </circle>

  <!-- Subtle Tech Circuit Lines -->
  <path d="M 0 80 L 180 80 L 220 120 L 340 120" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M 0 80 L 180 80 L 220 120 L 340 120" fill="none" stroke="#36BCF7" stroke-width="2" stroke-opacity="0.5" class="circuit-line" />
  <circle cx="340" cy="120" r="4" fill="#36BCF7" opacity="0.7" />

  <path d="M 1200 100 L 1020 100 L 980 140 L 860 140" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M 1200 100 L 1020 100 L 980 140 L 860 140" fill="none" stroke="#BB9AF7" stroke-width="2" stroke-opacity="0.5" class="circuit-line" />
  <circle cx="860" cy="140" r="4" fill="#BB9AF7" opacity="0.7" />

  <!-- Floating Code/Cloud Decorative Nodes -->
  <g class="float-1">
    <rect x="65" y="165" width="145" height="44" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <circle cx="87" cy="187" r="6" fill="#36BCF7" />
    <text x="103" y="191" class="code-deco" fill="#94a3b8">&lt;FullStack /&gt;</text>
  </g>

  <g class="float-2">
    <rect x="990" y="175" width="150" height="44" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <circle cx="1012" cy="197" r="6" fill="#BB9AF7" />
    <text x="1028" y="201" class="code-deco" fill="#94a3b8">aws :: cloud</text>
  </g>

  <!-- Animated Bottom Waves -->
  <path fill="url(#waveGrad2)" d="M0,310 C300,370 600,250 900,310 C1050,340 1150,320 1200,300 L1200,380 L0,380 Z">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0,310 C300,370 600,250 900,310 C1050,340 1150,320 1200,300 L1200,380 L0,380 Z;
              M0,295 C300,240 600,360 900,290 C1050,260 1150,310 1200,320 L1200,380 L0,380 Z;
              M0,310 C300,370 600,250 900,310 C1050,340 1150,320 1200,300 L1200,380 L0,380 Z" />
  </path>

  <path fill="url(#waveGrad1)" d="M0,330 C250,280 550,370 850,320 C1020,290 1120,335 1200,325 L1200,380 L0,380 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0,330 C250,280 550,370 850,320 C1020,290 1120,335 1200,325 L1200,380 L0,380 Z;
              M0,315 C250,365 550,275 850,340 C1020,355 1120,300 1200,315 L1200,380 L0,380 Z;
              M0,330 C250,280 550,370 850,320 C1020,290 1120,335 1200,325 L1200,380 L0,380 Z" />
  </path>

  <!-- Top Status Pill -->
  <g transform="translate(435, 38)">
    <rect width="330" height="32" rx="16" fill="#0f172a" stroke="#36BCF7" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="22" cy="16" r="4.5" fill="#10b981" class="pulse-dot" />
    <text x="38" y="20" class="badge-text">SYSTEM ONLINE // AVAILABLE FOR WORK</text>
  </g>

  <!-- Main Heading -->
  <text x="600" y="138" text-anchor="middle" class="title">
    Hi, I'm <tspan class="title-accent" filter="url(#neonGlow)">Mohammad Faizan Qureshi</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="182" text-anchor="middle" class="subtitle">
    FULL-STACK ENGINEER  •  AWS CLOUD ARCHITECT  •  DEVOPS AUTOMATION
  </text>

  <!-- Role Pills -->
  <g transform="translate(600, 232)">
    <!-- Pill 1 -->
    <g transform="translate(-355, 0)">
      <rect width="165" height="36" rx="18" fill="#1e293b" stroke="#36BCF7" stroke-width="1" stroke-opacity="0.45" />
      <text x="82.5" y="23" text-anchor="middle" class="pill-text">🐍 Python &amp; Django</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-175, 0)">
      <rect width="165" height="36" rx="18" fill="#1e293b" stroke="#7AA2F7" stroke-width="1" stroke-opacity="0.45" />
      <text x="82.5" y="23" text-anchor="middle" class="pill-text">⚛️ React Frontend</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(5, 0)">
      <rect width="165" height="36" rx="18" fill="#1e293b" stroke="#BB9AF7" stroke-width="1" stroke-opacity="0.45" />
      <text x="82.5" y="23" text-anchor="middle" class="pill-text">☁️ AWS Cloud Infra</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(185, 0)">
      <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#2AC3DE" stroke-width="1" stroke-opacity="0.45" />
      <text x="85" y="23" text-anchor="middle" class="pill-text">🐳 Docker &amp; Ansible</text>
    </g>
  </g>

  <!-- Location Tag -->
  <text x="600" y="308" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">
    📍 Nashik, Maharashtra, India   |   Building Scalable, Automated &amp; Resilient Cloud Systems
  </text>

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="1198" height="378" rx="17" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.45" />
</svg>
