<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BB9AF7">
        <animate attributeName="stop-color" values="#BB9AF7;#36BCF7;#BB9AF7" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#36BCF7">
        <animate attributeName="stop-color" values="#36BCF7;#BB9AF7;#36BCF7" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 20px;
      font-weight: 800;
      fill: #f8fafc;
    }
    .tag-featured {
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 10.5px;
      font-weight: 700;
      fill: #BB9AF7;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      fill: #94a3b8;
    }
    .bullet {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12.5px;
      fill: #cbd5e1;
    }
    .tech-pill {
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #BB9AF7;
    }
  </style>

  <rect x="2" y="2" width="536" height="266" rx="14" fill="url(#cardBg2)" stroke="url(#borderGrad2)" stroke-width="1.8" />

  <!-- Top Row -->
  <text x="26" y="42" class="title">🧅 Onion Bazar</text>
  <rect x="392" y="22" width="122" height="26" rx="13" fill="#0f172a" stroke="#BB9AF7" stroke-width="1" stroke-opacity="0.5" />
  <circle cx="408" cy="35" r="4" fill="#BB9AF7">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="420" y="39" class="tag-featured">FULL-STACK</text>

  <!-- Description -->
  <text x="26" y="72" class="desc">Modern API-driven full-stack marketplace &amp; web platform</text>
  <text x="26" y="90" class="desc">engineered for responsive UX and structured data management.</text>

  <!-- Highlights -->
  <text x="26" y="122" class="bullet"><tspan fill="#BB9AF7">▸</tspan> Dynamic, component-driven React.js user interface</text>
  <text x="26" y="146" class="bullet"><tspan fill="#36BCF7">▸</tspan> Decoupled Django REST API backend architecture</text>
  <text x="26" y="170" class="bullet"><tspan fill="#9ECE6A">▸</tspan> Mobile-first responsive layouts &amp; relational data modeling</text>

  <line x1="26" y1="194" x2="514" y2="194" stroke="#21262d" stroke-width="1" />

  <!-- Tech Stack Pills -->
  <g transform="translate(26, 212)">
    <rect x="0" y="0" width="80" height="28" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="40" y="18" text-anchor="middle" class="tech-pill">React.js</text>

    <rect x="90" y="0" width="76" height="28" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="128" y="18" text-anchor="middle" class="tech-pill">Django</text>

    <rect x="176" y="0" width="76" height="28" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="214" y="18" text-anchor="middle" class="tech-pill">Python</text>

    <rect x="262" y="0" width="88" height="28" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="306" y="18" text-anchor="middle" class="tech-pill">REST API</text>

    <rect x="360" y="0" width="110" height="28" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="415" y="18" text-anchor="middle" class="tech-pill">Full-Stack UI</text>
  </g>
</svg>
