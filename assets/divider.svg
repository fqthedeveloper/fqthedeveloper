<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 18" width="100%" height="18">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0" />
      <stop offset="20%" stop-color="#36BCF7" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#BB9AF7" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#36BCF7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="8" width="1200" height="2" fill="url(#divGrad)" />
  <circle cy="9" r="3.5" fill="#36BCF7" filter="url(#divGlow)">
    <animate attributeName="cx" values="120;1080;120" dur="7s" repeatCount="indefinite" />
  </circle>
</svg>
