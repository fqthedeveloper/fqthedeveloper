<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#131924" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36BCF7" />
      <stop offset="100%" stop-color="#BB9AF7" />
    </linearGradient>
  </defs>

  <!-- LEFT CARD: GitHub Stats -->
  <rect x="6" y="6" width="532" height="208" rx="14" fill="url(#cardBg)" stroke="#21262d" stroke-width="1.5" />

  <text x="32" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#36BCF7">
    ⚡ Mohammad Faizan's GitHub Stats
  </text>

  <!-- Stats Rows -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
    <text x="32" y="76" fill="#c9d1d9" font-weight="600">🔥 Total Contributions:</text>
    <text x="255" y="76" fill="#f8fafc" font-family="monospace" font-weight="700">1,018+</text>

    <text x="32" y="106" fill="#c9d1d9" font-weight="600">📦 Public Repositories:</text>
    <text x="255" y="106" fill="#f8fafc" font-family="monospace" font-weight="700">36</text>

    <text x="32" y="136" fill="#c9d1d9" font-weight="600">⭐ Total Stars Earned:</text>
    <text x="255" y="136" fill="#f8fafc" font-family="monospace" font-weight="700">13</text>

    <text x="32" y="166" fill="#c9d1d9" font-weight="600">☁️ Cloud &amp; DevOps Stack:</text>
    <text x="255" y="166" fill="#9ECE6A" font-family="monospace" font-weight="700">AWS • Docker • Ansible</text>

    <text x="32" y="194" fill="#c9d1d9" font-weight="600">🏅 Verified Credentials:</text>
    <text x="255" y="194" fill="#36BCF7" font-family="monospace" font-weight="700">AWS SAA &amp; 5+ Badges</text>
  </g>

  <!-- Animated Rank Ring -->
  <circle cx="452" cy="115" r="48" fill="none" stroke="#1e293b" stroke-width="8" />
  <circle cx="452" cy="115" r="48" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="265 302">
    <animateTransform attributeName="transform" type="rotate" from="0 452 115" to="360 452 115" dur="10s" repeatCount="indefinite" />
  </circle>
  <text x="452" y="118" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" fill="#f8fafc">A+</text>
  <text x="452" y="136" text-anchor="middle" font-family="monospace" font-size="10" fill="#36BCF7">RANK</text>

  <!-- RIGHT CARD: Top Languages -->
  <rect x="562" y="6" width="532" height="208" rx="14" fill="url(#cardBg)" stroke="#21262d" stroke-width="1.5" />

  <text x="588" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#36BCF7">
    💻 Most Used Languages
  </text>

  <!-- Combined Multi-Color Progress Bar -->
  <rect x="588" y="58" width="218" height="12" rx="4" fill="#3572A5" />
  <rect x="808" y="58" width="184" height="12" rx="4" fill="#f1e05a" />
  <rect x="994" y="58" width="52" height="12" rx="4" fill="#e34c26" />
  <rect x="1048" y="58" width="20" height="12" rx="4" fill="#563d7c" />

  <!-- Language Breakdown List -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">
    <!-- Python -->
    <circle cx="598" cy="100" r="6" fill="#3572A5" />
    <text x="614" y="105" fill="#e2e8f0" font-weight="700">Python (Django / FastAPI)</text>
    <text x="820" y="105" fill="#36BCF7" font-family="monospace" font-weight="700">45.2%</text>

    <!-- JavaScript -->
    <circle cx="598" cy="130" r="6" fill="#f1e05a" />
    <text x="614" y="135" fill="#e2e8f0" font-weight="700">JavaScript (React.js / ES6+)</text>
    <text x="820" y="135" fill="#f1e05a" font-family="monospace" font-weight="700">38.7%</text>

    <!-- HTML5 -->
    <circle cx="598" cy="160" r="6" fill="#e34c26" />
    <text x="614" y="165" fill="#e2e8f0" font-weight="700">HTML5 &amp; Web Templates</text>
    <text x="820" y="165" fill="#e34c26" font-family="monospace" font-weight="700">11.3%</text>

    <!-- CSS3 / Shell / IaC -->
    <circle cx="598" cy="190" r="6" fill="#BB9AF7" />
    <text x="614" y="195" fill="#e2e8f0" font-weight="700">CSS3 / Shell / Ansible YAML</text>
    <text x="820" y="195" fill="#BB9AF7" font-family="monospace" font-weight="700">4.8%</text>
  </g>

  <!-- Right Side Badge Accent -->
  <rect x="915" y="96" width="152" height="96" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <text x="991" y="125" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">PRIMARY STACK</text>
  <text x="991" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#36BCF7">Python + React</text>
  <text x="991" y="170" text-anchor="middle" font-family="monospace" font-size="11" fill="#9ECE6A">+ AWS Cloud</text>
</svg>
